name: apk
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Install buildozer
        run: pip install --upgrade pip "cython<3" buildozer
      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Tampilkan error
        if: failure()
        run: |
          grep -nE -i "error|failed|fatal|undefined reference|not found|No such" build.log | grep -v "^.*# " | tail -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          tail -30 build.log | while IFS= read -r l; do echo "::warning::${l:0:400}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: HOH-apk
          path: bin/*.apk
