name: apk
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Install buildozer
        run: pip install --upgrade pip "cython<3" buildozer
      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Tampilkan error
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          wc -l clean.log
          msg=$(grep -n -i -B3 -A12 -E "what went wrong|Execution failed|Traceback|BUILD FAILED|FAILURE:|Exception|No such file|cannot find" clean.log | cut -c1-200 | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -z "$msg" ] && msg=$(tail -n 400 clean.log | grep -v "^#     " | head -n 60 | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=BUILD-LOG::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: HOH-apk
          path: bin/*.apk
