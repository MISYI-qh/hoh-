 lg_about:["Tentang HOH",["HOH adalah asisten AI buatan sendiri yang berjalan di perangkatmu, ditulis dengan Python dan NumPy.","HOH adalah anak dari perusahaan Misyi, yang dibuat oleh Faqih Musyaffa. HOH adalah filsafat dari sudut pandang makhluk hidup, mesin, dan benda mati; ia merenung dan menganalisis, tidak membuat apa pun.","Kamu bisa mengobrol, mengajari HOH lewat perintah /ajari, mengunggah bahan belajar, dan melatihnya langsung dari halaman Latih. Seluruh model bisa diekspor dan diimpor sebagai berkas .hh.","Versi 1.1.0"]],
 lg_policy:["Kebijakan Penggunaan",["Gunakan HOH untuk hal yang baik dan sah. Jangan memakainya untuk melanggar hukum, menyakiti orang lain, menipu, atau menyebarkan data pribadi orang lain.","Jawaban AI dapat keliru, terutama pada model kecil yang baru dilatih. Periksa kembali informasi penting sebelum kamu mengandalkannya.","Kamu bertanggung jawab atas data yang kamu ajarkan dan unggah ke HOH. Unggah hanya materi yang memang boleh kamu gunakan.","HOH hanya untuk pengguna berusia minimal 10 tahun. Usia dihitung dari tanggal lahir yang kamu masukkan saat mendaftar."]],
 lg_privacy:["Kebijakan Privasi",["Akun, obrolan, ajaran, dan sumber belajar disimpan di perangkatmu. Aplikasi ini tidak mengirimnya ke server Misyi atau pihak lain; mesin HOH hanya berjalan di perangkatmu.","Sandi disimpan sebagai hash, bukan teks asli. Karena tidak ada konfirmasi atau sandi cadangan, sandi yang terlupa tidak bisa dipulihkan.","Kamu bisa mengekspor semua data atau menghapus obrolan dan akunmu kapan saja dari halaman Pengaturan. Menghapus data aplikasi dari perangkat juga menghapus semuanya.","Input suara memakai layanan pengenalan suara milik browser atau perangkatmu, jika tersedia. Penyedia gambar dan tautan yang kamu atur sendiri akan menerima permintaan yang kamu kirim ke sana."]],
 lg_terms:["Syarat Layanan",["Dengan memakai HOH kamu menyetujui kebijakan penggunaan dan privasi.","HOH disediakan apa adanya tanpa jaminan. Misyi tidak bertanggung jawab atas kerugian akibat jawaban yang keliru.","Misyi dapat memperbarui aplikasi dan syarat ini; versi terbaru akan tertera di halaman ini."]],

 lg_about:["About HOH",["HOH is a self-made AI assistant that runs on your device, written in Python and NumPy.","HOH is a child of the company Misyi, which was made by Faqih Musyaffa. HOH is philosophy from the viewpoint of living things, machines, and lifeless objects; it reflects and analyzes, and creates nothing.","You can chat, teach HOH with the /ajari command, upload learning material, and train it right from the Train page. The whole model can be exported and imported as a .hh file.","Version 1.1.0"]],
 lg_policy:["Usage Policy",["Use HOH for good and lawful purposes. Don't use it to break the law, hurt others, deceive, or spread other people's personal data.","AI answers can be wrong, especially from a small, freshly trained model. Double-check important information before relying on it.","You are responsible for the data you teach and upload to HOH. Only upload material you are allowed to use.","HOH is for users aged 10 and up. Age is calculated from the date of birth you enter when signing up."]],

function calc(src){let s=src.toLowerCase().replace(/\s+/g,"").replace(/[x×]/g,"*").replace(/÷/g,"/").replace(/\^/g,"**");if(s.includes(",")&&!s.includes("."))s=s.replace(/,/g,".");else s=s.replace(/,/g,"");
 let p=0;const pk=()=>s[p],num=()=>{const m=s.slice(p).match(/^\d+(\.\d+)?/);if(!m)throw 0;p+=m[0].length;return parseFloat(m[0])};
 const prim=()=>{if(pk()=="("){p++;const v=add();if(pk()!=")")throw 0;p++;return pct(v)}if(pk()=="-"){p++;return-prim()}if(pk()=="+"){p++;return prim()}return pct(num())};const pct=v=>{while(pk()=="%"){p++;v/=100}return v};
 const pow=()=>{let b=prim();if(s.slice(p,p+2)=="**"){p+=2;const e=pow();if(Math.abs(e)>1000)throw 0;b=Math.pow(b,e)}return b};
 const mul=()=>{let v=pow();while(pk()=="*"&&s[p+1]!="*"||pk()=="/"){const o=s[p++];const r=pow();if(o=="/"&&r==0)throw 0;v=o=="*"?v*r:v/r}return v};
 const add=()=>{let v=mul();while(pk()=="+"||pk()=="-"){const o=s[p++];const r=mul();v=o=="+"?v+r:v-r}return v};
 const v=add();if(p!=s.length||!isFinite(v))throw 0;return v}
const fmtNum=v=>{const r=Math.abs(v)>=1e15||(Math.abs(v)<1e-6&&v!=0)?v.toExponential(6):String(+v.toPrecision(12));return r.replace(".",LANG=="id"?",":".")};

async function imgStats(src){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,100/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const g=c.getContext("2d");g.drawImage(im,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height).data,cnt={};let lum=0,n=0,bright=0;for(let i=0;i<d.length;i+=4){const r=d[i],gg=d[i+1],b=d[i+2];lum+=.299*r+.587*gg+.114*b;n++;if(.299*r+.587*gg+.114*b>215)bright++;let best=0,bd=1e9;CN.forEach((c2,j)=>{const dd=(r-c2[2][0])**2+(gg-c2[2][1])**2+(b-c2[2][2])**2;if(dd<bd){bd=dd;best=j}});cnt[best]=(cnt[best]||0)+1}const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>CN[e[0]][LANG=="id"?0:1]);res({w:im.naturalWidth||im.width,h:im.naturalHeight||im.height,lum:lum/n,bright:bright/n,top,kinds:Object.keys(cnt).length})};im.onerror=()=>res(null);im.src=src})}
async function analyze(files,q){const out=[];let img=false;

   const tx=(f.x||"").trim();b+="\n\n"+(tx?`**${t("an_text")}**\n> ${tx.slice(0,700).replace(/\n+/g,"\n> ")}`:t("an_notext"));out.push(b);continue}

  if(/^(csv|tsv)$/.test(ext)){const d=ext=="tsv"?"\t":ln[0].split(";").length>ln[0].split(",").length?";":",",cols=ln[0].split(d).map(c=>c.trim().replace(/^"|"$/g,""));b+=t("an_cols",cols.length,cols.slice(0,12).join(", "))+"\n\n"+t("an_rows",Math.max(0,ln.filter(z=>z.trim()).length-1))+"\n\n"}
  else if(ext=="json"){try{const j=JSON.parse(x);b+=(Array.isArray(j)?`array · ${j.length}`:`keys: ${Object.keys(j).slice(0,12).join(", ")}`)+"\n\n"}catch{}}
  const sm=summarize(x);if(sm.length&&!/^(csv|tsv|json)$/.test(ext))b+=`**${t("an_sum")}**\n${sm.map(s=>"- "+s).join("\n")}\n\n`;const kw=kwords(x);if(kw.length)b+=`**${t("an_kw")}:** ${kw.join(", ")}`;out.push(b.trim())}
 if(q&&/\?|apa|siapa|kapan|dimana|di mana|berapa|bagaimana|mengapa|kenapa|what|who|when|where|how|why/i.test(q)){const qw=new Set(words(q)),docs=files.map(f=>f.x||"").join("\n"),hit=sentences(docs).map(s=>({s,v:words(s).filter(w=>qw.has(w)).length})).filter(e=>e.v>0).sort((a,b)=>b.v-a.v).slice(0,2);if(hit.length)out.push(`> ${hit.map(h=>h.s).join(" ")}`)}
 if(img)out.push(`*${t("an_note")}*`);return out.join("\n\n")}

function parseTags(raw){const steps=[];let ans="",last=0,m;const re=/<(think|cek|cari|riset|ingat)>/g;
 while((m=re.exec(raw))){ans+=raw.slice(last,m.index);const tag=m[1],close="</"+tag+">",st=m.index+m[0].length,en=raw.indexOf(close,st);
  if(en<0){steps.push({tag,text:raw.slice(st),open:true});return{ans,steps}}
  steps.push({tag,text:raw.slice(st,en),open:false});last=en+close.length;re.lastIndex=last}
 ans+=raw.slice(last);return{ans,steps}}

async function toWav16k(blob){const ab=await blob.arrayBuffer(),AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),buf=await ctx.decodeAudioData(ab);ctx.close&&ctx.close();
 const n=Math.ceil(Math.min(buf.duration,90)*16000),off=new OfflineAudioContext(1,n,16000),src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start(0);const x=(await off.startRendering()).getChannelData(0);
 const pcm=new Int16Array(x.length);for(let i=0;i<x.length;i++){const v=Math.max(-1,Math.min(1,x[i]));pcm[i]=v<0?v*32768:v*32767}
